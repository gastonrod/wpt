<!doctype html>
<!--
The soft navigation version of the identically named test in
/largest-contentful-paint/first-letter-background.html.
Notes:
- Added soft navigation, awaiting LCP before that, and then awaiting
  both soft navigation and soft LCP entries after the click.
- The former main logic is now inside of a promise.
-->
<meta charset="utf-8" />
<title>
  Largest Contentful Paint after soft navigation: observe element with background image in its first
  letter
</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<script src="/largest-contentful-paint/resources/largest-contentful-paint-helpers.js"></script>
<script src="/soft-navigation-heuristics/resources/soft-navigation-test-helper.js"></script>
<script>
  function clickHandler() {
    document.body.innerHTML = `
        <style>
          div::first-letter {
            background-image: url("/images/black-rectangle.png");
          }
          div {
            font-size: 12px;
          }
        </style>
        <div id='target'>A</div>
      `;
    history.pushState({}, "", "/test");
  }
</script>
<body>
  <button id="click-target" onclick="clickHandler()">Click!</button>
</body>
<script>
  setup({ hide_test_state: true });
  promise_test(async (t) => {
    assert_implements(window.LargestContentfulPaint, "LargestContentfulPaint is not implemented");
    const helper = new SoftNavigationTestHelper(t);
    const lcpEntries = await helper.getBufferedPerformanceEntriesWithTimeout(
      /*type=*/ "largest-contentful-paint",
      /*includeSoftNavigationObservations=*/ false,
      /*minNumEntries=*/ 1,
    );
    assert_equals(lcpEntries.length, 1, "There should be only one LCP entry");
    assert_equals(lcpEntries[0].id, "click-target", "The first entry should be the button");
    const promise = Promise.all([
      SoftNavigationTestHelper.getPerformanceEntries(
        /*type=*/ "soft-navigation",
        /*includeSoftNavigationObservations=*/ false,
        /*minNumEntries=*/ 1,
      ),
      new Promise((resolve) => {
        let observedFirstLetter = false;
        let beforeLoad = performance.now();
        const observer = new PerformanceObserver((entryList) => {
          const entry = entryList.getEntries()[entryList.getEntries().length - 1];
          if (!observedFirstLetter) {
            // When we haven't observed first-letter as LCP...
            // If we happen to get a text entry due to text happening before the image, return.
            if (entry.url === "") {
              assert_equals(entry.entryType, "largest-contentful-paint");
              assert_greater_than_equal(entry.renderTime, beforeLoad);
              assert_greater_than_equal(performance.now(), entry.renderTime);
              assert_approx_equals(
                entry.startTime,
                entry.renderTime,
                0.001,
                "startTime should be equal to renderTime to the precision of 1 millisecond.",
              );
              assert_equals(entry.duration, 0);
              assert_equals(entry.loadTime, 0);
              assert_equals(entry.id, "target");
              assert_equals(entry.element, document.getElementById("target"));
            } else {
              const url = window.location.origin + "/images/black-rectangle.png";
              checkImage(entry, url, "target", 0, beforeLoad, ["sizeLowerBound"]);
            }

            // Now change the div content to proceed to the second part of the test.
            beforeLoad = performance.now();
            const div = document.createElement("div");
            div.id = "target2";
            div.innerHTML = "long text will now be LCP";
            document.body.appendChild(div);
            observedFirstLetter = true;
          } else {
            // Ignore entries that are caused by the initial 'target'.
            if (entry.id === "target") return;
            // The LCP must now be text.
            if (entry.url !== "") assert_unreached("First-letter background should not be LCP!");

            assert_equals(entry.entryType, "largest-contentful-paint");
            assert_greater_than_equal(entry.renderTime, beforeLoad, "blaaa");
            assert_greater_than_equal(performance.now(), entry.renderTime, "bleee");
            assert_approx_equals(
              entry.startTime,
              entry.renderTime,
              0.001,
              "startTime should be equal to renderTime to the precision of 1 millisecond.",
            );
            assert_equals(entry.duration, 0);
            assert_equals(entry.id, "target2");
            const div = document.getElementById("target2");
            // Estimate the text size: 12 * 100
            assert_greater_than_equal(entry.size, 1200);
            assert_equals(entry.loadTime, 0);
            assert_equals(entry.element, div);
            resolve(entry);
          }
        });
        observer.observe({
          type: "largest-contentful-paint",
          includeSoftNavigationObservations: true,
        });
      }),
    ]);
    if (test_driver) {
      test_driver.click(document.getElementById("click-target"));
    }
    const [softNavigationEntries, lastSoftLcpEntry] = await promise;
    assert_equals(
      softNavigationEntries.length,
      1,
      "There should be only one soft navigation entry",
    );
    assert_equals(
      lastSoftLcpEntry.id,
      "target2",
      "The last soft LCP entry should be the long text",
    );
    assert_equals(
      softNavigationEntries[0].navigationId,
      lastSoftLcpEntry.navigationId,
      "The soft navigation entry should have the same navigation ID as the last soft LCP entry",
    );
  }, "Largest Contentful Paint after soft navigation: first-letter is observable.");
</script>
